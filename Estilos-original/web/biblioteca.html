<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Estilos · Biblioteca de diseño UI</title>
<script>/* La biblioteca vive ahora en Tinta (index.html#bloques). Esta página clásica solo se abre con ?clasica=1
   (se recuerda en la pestaña) o desde un enlace compartido antiguo (#p1=…). */
(function(){try{var h=location.hash;if(/[?&]clasica=1/.test(location.search))sessionStorage.setItem("estilos-clasica","1");else if(!/^#p1=/.test(h)&&!sessionStorage.getItem("estilos-clasica"))location.replace("index.html#bloques")}catch(e){}})();</script>
<noscript><meta http-equiv="refresh" content="0;url=index.html#bloques"></noscript>
<meta name="theme-color" content="#29223F">
<script>/* Aplica el tema antes de pintar: evita el destello blanco en modo oscuro. */
(function(){var t="light";try{t=localStorage.getItem("estilos-theme")||localStorage.getItem("estilos-studio-theme")||"light"}catch(e){}
var d=t==="dark"||(t!=="light"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);
document.documentElement.setAttribute("data-theme",d?"dark":"light");
document.querySelector('meta[name="theme-color"]').content=d?"#29223F":"#DAD7EC";})();</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/styles.css">
<link rel="stylesheet" href="css/studio-shell.css">
<link rel="stylesheet" href="css/tinta-skin.css">
</head>
<body data-app="library">
<div id="app"><main id="view" aria-live="polite"></main></div>
<nav id="nav" aria-label="Navegación principal"></nav>
<div id="actbar" class="actbar" style="display:none"></div>
<div id="sheetWrap" class="sheetWrap" style="display:none" role="dialog" aria-modal="true"><div class="sheetCard" id="sheetCard"></div></div>
<div id="lightbox" style="display:none" role="dialog" aria-modal="true" aria-label="Imagen de referencia"><img id="lbImg" src="" alt="" data-act="closelb"><div id="lbCap"></div><div class="lbBar" id="lbBar"></div></div>
<input type="file" id="fileRef" accept="image/*" multiple hidden>
<input type="file" id="fileJson" accept="application/json,.json,text/plain" hidden>
<script src="js/util.js"></script>
<script src="js/icons.js"></script>
<script src="js/designs-core.js"></script>
<script src="js/designs-a.js"></script>
<script src="js/designs-b.js"></script>
<script src="js/designs-c.js"></script>
<script src="js/designs-d.js"></script>
<script src="js/data.js"></script>
<script src="js/designs-extra.js"></script>
<script src="js/stacks.js"></script>
<script src="js/userrefs.js"></script>
<script src="js/media.js"></script>
<script src="js/creator-mobile.js"></script>
<script src="js/image-export.js"></script>
<script src="js/export.js"></script>
<script src="js/autobackup.js"></script>
<script src="js/share.js"></script>
<script src="js/app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  const had = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (had && !reloaded) { reloaded = true; location.reload(); } });
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").then(r => {
    const check = () => r.update().catch(() => {});
    document.addEventListener("visibilitychange", () => { if (!document.hidden) check(); });
    setInterval(check, 30 * 60 * 1000);
  }).catch(() => {}));
}
</script>
</body></html>
