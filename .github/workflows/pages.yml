name: Publicar PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Publicar sin ejecutar las pruebas (solo para emergencias)"
        type: boolean
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  # La PWA solo se publica si pasan las pruebas de extremo a extremo (ver tests.yml).
  tests:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.skip_tests) }}
    uses: ./.github/workflows/tests.yml
  deploy:
    needs: tests
    # «skipped» cubre la publicación manual con skip_tests; si las pruebas fallan o se cancelan, no se publica.
    if: ${{ !cancelled() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.d.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - name: Sellar versión de Tinta
        run: |
          V="tinta-${{ github.run_id }}-${{ github.run_attempt }}"
          sed -i "s/const BUILD = \"[^\"]*\"/const BUILD = \"$V\"/" web/sw.js
          sed -i "s/const APP_VERSION = \"[^\"]*\"/const APP_VERSION = \"14.1.${{ github.run_number }}\"/" web/js/util.js
          grep -n "$V" web/sw.js
      - uses: actions/upload-pages-artifact@v3
        with: { path: web }
      - id: d
        uses: actions/deploy-pages@v4
